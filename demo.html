<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Roster Planner · 交互演示</title>
<style>
:root{color-scheme:light;--nav:#172b28;--paper:#f5f7f4;--ink:#1c2c26;--muted:#596a62;--line:#dce5dd;--green:#08674f;--mint:#dff3e9;--orange:#943e21;--peach:#fceae2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #63ad97;outline-offset:3px}
.layout{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}
aside{background:var(--nav);padding:30px 20px;color:white;display:flex;flex-direction:column;gap:35px}.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:750;line-height:1.25}.logo{border-radius:11px;background:#b8ead1;color:#143c2e;width:40px;height:40px;display:grid;place-items:center;flex:none;font-size:20px}nav{display:grid;gap:6px}nav button{border:0;color:#c9d9d1;background:transparent;padding:11px 13px;text-align:left;border-radius:8px;white-space:nowrap}nav button:hover,nav button[aria-current="page"]{color:white;background:#2e4c43}nav span{display:inline-block;width:27px;color:#abdac3}.reset{margin-top:auto;color:#dcece4;background:transparent;border:1px solid #547166;border-radius:8px;padding:9px}
main{width:min(100%,1270px);margin-inline:auto;padding:32px clamp(18px,4vw,54px) 48px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}.context{color:var(--muted);font-size:13px}.context strong{color:var(--ink)}h1,h2,h3,p{margin:0}h1{font-size:clamp(29px,4vw,43px);letter-spacing:-.045em;line-height:1.16;margin-bottom:10px}h2{font-size:20px}h3{font-size:16px}.muted{color:var(--muted)}.intro{margin-bottom:22px}.panel,.metric{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}.panel{margin-bottom:16px}.panel-head,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-start}.panel-head{margin-bottom:15px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-bottom:1px solid var(--line);margin-bottom:24px}.flow div{border-bottom:2px solid transparent;padding:0 0 11px;color:var(--muted);font-size:13px}.flow div.active{border-color:var(--green);color:var(--green);font-weight:750}.tag{display:inline-flex;border-radius:6px;background:var(--mint);color:var(--green);padding:4px 9px;white-space:nowrap;font-size:12px;font-weight:750}.tag.critical{background:var(--peach);color:var(--orange)}.tag.neutral{background:#edf1ec;color:#43544a}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.metric strong{display:block;font-size:30px;line-height:1.3;margin-top:7px;font-variant-numeric:tabular-nums}.metric small{color:var(--muted)}.meter{height:6px;border-radius:9px;background:#eff3ef;margin-top:14px;overflow:hidden}.meter span{display:block;height:100%;background:#3e9a76}.meter.bad span{background:#c85d3a}
.btn{border:1px solid #c9d7ce;border-radius:8px;background:#fff;color:var(--ink);padding:9px 14px;font-weight:700}.btn:hover{background:#eef5ef}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.primary:hover{background:#07533f}.btn:disabled{opacity:.55;cursor:default}select{background:white;border:1px solid #c9d7ce;border-radius:8px;padding:8px;color:var(--ink)}.toolbar{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:15px}.toolbar label{display:flex;gap:7px;align-items:center}
table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #edf1ed}th{font-size:12px;color:var(--muted);background:#f5f8f5}tr:last-child td{border-bottom:0}.scroll{overflow-x:auto}.shift{display:inline-block;min-width:30px;text-align:center;border-radius:5px;background:#edf0ed;color:#46534b;font-size:12px;font-weight:750;padding:2px 5px}.shift.D{background:#e0f3e7;color:#205c41}.shift.N{background:#e5ecfc;color:#344e8c}.shift.S{background:#f8edcf;color:#704f15}.shift.L{background:var(--peach);color:var(--orange)}.callout{border-left:3px solid #66a98f;background:#edf7ef;padding:13px 15px;border-radius:7px;margin-bottom:16px}.callout.warn{background:#fff2e9;border-color:#b95130}.plan .row{margin-bottom:13px}.basket{display:grid;gap:8px;margin:12px 0}.log{padding-left:19px;color:var(--muted)}footer{font-size:12px;color:var(--muted);margin-top:22px}.notice:empty{display:none}.notice{margin-bottom:14px;color:var(--green);font-weight:700}
@media(max-width:850px){.layout{grid-template-columns:minmax(0,1fr)}aside{min-width:0;padding:15px 18px;gap:13px}nav{display:flex;overflow:auto;gap:3px}nav button{padding:7px 9px}nav span{display:none}.reset{position:absolute;right:18px;top:17px}.brand{padding-right:100px}main{padding-top:18px}}
@media(max-width:510px){.metrics{grid-template-columns:1fr}.metric{padding:13px 16px}.metric strong{font-size:24px}.panel{padding:15px}.flow{gap:6px}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><span class="logo" aria-hidden="true">▦</span><span>Shift Roster<br>Planner</span></div>
  <nav aria-label="排班页面" id="nav"></nav>
  <button class="reset" data-action="reset">重置演示</button>
</aside>
<main>
  <header><div class="context"><strong>经理工作台</strong>　/　2026 年 12 月</div><span class="tag neutral">离线交互演示</span></header>
  <div id="flow" class="flow" aria-label="演示进度"></div>
  <div id="notice" class="notice" role="status"></div>
  <section id="view" aria-labelledby="title"></section>
  <footer>演示使用虚拟排班与预先验证的方案。实际应用由 Streamlit 和 Python 求解器运行。</footer>
</main>
</div>
<script>
"use strict";

const pages = [
  ["roster", "▦", "主排班表"], ["leave", "＋", "请假管理"],
  ["coverage", "◫", "人力覆盖"], ["advisor", "↗", "调班建议"],
  ["history", "✓", "确认与历史"],
];
const dates = ["2026-11-30", "2026-12-01", "2026-12-02", "2026-12-03", "2026-12-04", "2026-12-05", "2026-12-06"];
const target = "2026-12-03";
const sample =
[["A01","SENIOR",["S","D","N","O","R","D","N"]],["A02","SENIOR",["R","D","N","O","S","D","N"]],["A03","SENIOR",["R","D","N","O","R","D","N"]],["A04","SENIOR",["S","D","N","O","R","D","N"]],["A05","JUNIOR",["R","D","N","O","S","D","N"]],["B01","SENIOR",["O","S","D","N","O","R","D"]],["B02","SENIOR",["O","R","D","N","O","S","D"]],["B03","SENIOR",["O","R","D","N","O","R","D"]],["B04","SENIOR",["O","S","D","N","O","R","D"]],["B05","JUNIOR",["O","R","D","N","O","S","D"]],["C01","SENIOR",["N","O","S","L","N","O","R"]],["C02","SENIOR",["N","O","R","L","N","O","S"]],["C03","SENIOR",["N","O","R","D","N","O","R"]],["C04","JUNIOR",["N","O","S","D","N","O","R"]],["C05","JUNIOR",["N","O","R","D","N","O","S"]],["D01","SENIOR",["D","N","O","S","D","N","O"]],["D02","SENIOR",["D","N","O","R","D","N","O"]],["D03","SENIOR",["D","N","O","R","D","N","O"]],["D04","JUNIOR",["D","N","O","S","D","N","O"]]];
const options = [
  { id: "D01", before: "S", after: "D", label: "待命转白班", hours: 2 },
  { id: "D02", before: "R", after: "D", label: "休整日召回", hours: 12 },
  { id: "D03", before: "R", after: "D", label: "休整日召回", hours: 12 },
];
const start = () => ({
  page: "coverage", team: "all", version: "effective", leave: false, preview: false,
  searched: false, selected: null, accepted: false, rejected: [], committed: null, log: [],
});
let state = start();
const selectedDay = dates.indexOf(target);
const selectOption = id => options.find(option => option.id === id);
const shiftNames = {D:"白班",N:"夜班",S:"待命",O:"休息",R:"休整",L:"请假"};
const shiftTag = code => `<span class="shift ${code}" title="${shiftNames[code]}">${code}</span>`;
const button = (label, action, primary = false, disabled = false) =>
  `<button type="button" class="btn${primary ? " primary" : ""}" data-action="${action}" ${disabled ? "disabled" : ""}>${label}</button>`;
const heading = (title, subtitle) => `<div class="intro"><h1 id="title" tabindex="-1">${title}</h1><p class="muted">${subtitle}</p></div>`;
const status = critical => `<span class="tag ${critical ? "critical" : ""}">${critical ? "CRITICAL · 人力缺口" : "NORMAL · 覆盖正常"}</span>`;

function effectiveShift(id, index, original = false, proposal = null) {
  const base = sample.find(row => row[0] === id)[2][index];
  if (original || index !== selectedDay) return base;
  if (state.leave && id === "C03") return "L";
  if (id === (proposal || state.committed)) return selectOption(id).after;
  return base;
}

function coverage(proposal = null, preview = false) {
  const assigned = sample.map(([id, experience]) => ({
    id, experience, shift: preview && id === "C03" ? "L" : effectiveShift(id, selectedDay, false, proposal),
  }));
  const forShifts = (...codes) => assigned.filter(person => codes.includes(person.shift));
  const day = forShifts("D");
  const night = forShifts("N");
  return {
    counts: [forShifts("D","S").length, day.length, night.length],
    daySenior: day.filter(person => person.experience === "SENIOR").map(person => person.id),
    nightSenior: night.filter(person => person.experience === "SENIOR").map(person => person.id),
  };
}

function metrics(report) {
  return `<div class="metrics">${["08:00–18:00","18:00–20:00","20:00–次日 08:00"].map((label, index) => {
    const count = report.counts[index];
    const aim = [4,3,3][index];
    return `<article class="metric"><small>${label}</small><strong>${count} <small>人</small></strong><small>正常目标 ${aim} 人 · 最低 3 人</small><div class="meter ${count < 3 ? "bad" : ""}"><span style="width:${Math.min(count / aim, 1) * 100}%"></span></div></article>`;
  }).join("")}</div>`;
}

function dashboard() {
  const report = coverage();
  const critical = report.counts.some(count => count < 3) || !report.daySenior.length || !report.nightSenior.length;
  return heading("人力覆盖", "查看每个时段的人数，以及完整覆盖白班和夜班的 Senior。") +
    `<div class="panel"><div class="panel-head"><div><h2>12 月 3 日，星期四</h2><p class="muted">Asia/Singapore · 19 位员工 / 4 个组</p></div>${status(critical)}</div></div>` +
    metrics(report) +
    `<div class="panel"><div class="panel-head"><h2>全班 Senior 覆盖</h2></div><div class="scroll"><table><thead><tr><th>班次</th><th>全程在岗</th><th>最低要求</th></tr></thead><tbody>
      <tr><td>白班 · 08:00–20:00</td><td>${report.daySenior.join("、") || '<span class="tag critical">缺 1 名 Senior</span>'}</td><td>1 名</td></tr>
      <tr><td>夜班 · 20:00–次日 08:00</td><td>${report.nightSenior.join("、") || '<span class="tag critical">缺 1 名 Senior</span>'}</td><td>1 名</td></tr>
    </tbody></table></div></div>` +
    (critical
      ? `<div class="callout warn">18:00–20:00 缺 1 人，同时白班缺少一名全程在岗的 Senior。</div>${button("查看可行调班建议", "page:advisor", true)}`
      : state.committed
        ? button("查看已生效的排班", "page:roster", true)
        : button("模拟 C03 请假", "page:leave", true));
}

function rosterPage() {
  const rows = sample.filter(([id]) => state.team === "all" || id[0] === state.team);
  return heading("主排班表", "查看 19 位虚拟员工的一周排班，切换原始与生效版本。") +
    `<div class="panel"><div class="toolbar"><label>小组 <select id="team">${["all","A","B","C","D"].map(team =>
      `<option value="${team}" ${team === state.team ? "selected" : ""}>${team === "all" ? "全部" : team + " 组"}</option>`).join("")}</select></label>
      <label>版本 <select id="version"><option value="effective">生效排班</option><option value="original" ${state.version === "original" ? "selected" : ""}>原始排班</option></select></label></div>
      <div class="scroll"><table><thead><tr><th>员工</th><th>资历</th>${dates.map(day => `<th>${day.slice(5)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(([id, exp]) => `<tr><td>${id}</td><td>${exp === "SENIOR" ? "Senior" : "Junior"}</td>${dates.map((_, index) =>
        `<td>${shiftTag(effectiveShift(id, index, state.version === "original"))}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>` +
    button("导出生效排班 CSV", "export");
}

function leavePage() {
  return heading("请假管理", "查看已有请假，并模拟一笔新增的全天请假。") +
    `<div class="panel"><div class="panel-head"><h2>12 月 3 日的请假</h2></div>
      <div class="scroll"><table><thead><tr><th>员工</th><th>原班次</th><th>状态</th></tr></thead><tbody>
      ${(state.leave ? ["C01","C02","C03"] : ["C01","C02"]).map(id => `<tr><td>${id}</td><td>${shiftTag("D")}</td><td>已记录</td></tr>`).join("")}
      </tbody></table></div></div>` +
    (state.leave ? button("查看人力覆盖", "page:coverage", true) :
      `<div class="panel"><div class="panel-head"><div><h2>C03 · 全天请假</h2><p class="muted">12 月 3 日 · C 组 Senior · 原班次 D</p></div></div>
      <div class="actions">${button("预览影响", "preview")}${button("记录请假", "leave", true)}</div></div>
      ${state.preview ? '<div class="callout warn">模拟结果：18:00–20:00 少 1 人，且白班缺少全程 Senior。</div>' + metrics(coverage(null, true)) : ""}`);
}

function advisorPage() {
  const headline = heading("调班建议", "比较覆盖变化、班次变更和额外计划工时。");
  if (state.committed) return headline + `<div class="callout">调班已生效。</div>${button("查看提交历史","page:history",true)}`;
  if (!state.leave) return headline + `<div class="callout">当前演示排班覆盖正常。记录 C03 请假后即可查看调班建议。</div>${button("前往请假管理","page:leave",true)}`;
  if (!state.searched) return headline + `<div class="callout warn">12 月 3 日的白班同时存在人数与 Senior 缺口。</div>${button("查找调班方案", "search", true)}`;
  const available = options.filter(option => !state.rejected.includes(option.id));
  return headline + (available.length ? available.map((option, index) => {
    const before = coverage(), after = coverage(option.id);
    return `<article class="panel plan"><div class="row"><div><h2>${option.label} · ${option.id}</h2><p class="muted">计划工时 +${option.hours} 小时 · 12 月 3 日</p></div><span class="tag">${index === 0 ? "首选方案" : "备选方案"}</span></div>
      <div class="basket"><div>${shiftTag(option.before)} → ${shiftTag(option.after)}</div><div>18:00–20:00 人数 <strong>${before.counts[1]} → ${after.counts[1]}</strong> · 白班全程 Senior <strong>${before.daySenior.length} → ${after.daySenior.length}</strong></div></div>
      ${button("送交确认", "select:" + option.id, index === 0)}</article>`;
  }).join("") : '<div class="callout warn">演示中的三项预设方案均已被拒绝。</div>');
}

function historyPage() {
  const current = selectOption(state.selected || state.committed);
  const history = state.log.length ? `<div class="panel"><h2>操作历史</h2><ol class="log">${state.log.map(entry => `<li>${entry}</li>`).join("")}</ol></div>` : "";
  return heading("确认与历史", "记录员工同意或拒绝，取得同意后提交完整方案。") +
    (state.committed ? `<div class="panel"><div class="panel-head"><h2>${current.id} · ${current.label}</h2><span class="tag">已提交</span></div>${button("导出生效排班 CSV", "export", true)}</div>`
      : current ? `<div class="panel"><div class="panel-head"><h2>${current.id} · ${current.label}</h2><span class="tag neutral">${state.accepted ? "员工已同意" : "等待员工回复"}</span></div>
      <div class="actions">${button("记录同意", "accept", false, state.accepted)}${button("记录拒绝", "reject")}${button("提交调班", "commit", true, !state.accepted)}</div></div>`
      : `<div class="callout">当前没有待确认的方案。</div>${button("前往调班建议", "page:advisor", true)}`) + history;
}

const screens = {roster:rosterPage,leave:leavePage,coverage:dashboard,advisor:advisorPage,history:historyPage};
function render(message = "", focus = false) {
  document.querySelector("#nav").innerHTML = pages.map(([page, icon, label]) =>
    `<button type="button" data-action="page:${page}" ${page === state.page ? 'aria-current="page"' : ""}><span aria-hidden="true">${icon}</span>${label}</button>`).join("");
  const stage = state.selected || state.committed ? 2 : state.leave ? 1 : 0;
  document.querySelector("#flow").innerHTML = ["处理请假","恢复覆盖","员工确认"].map((label, index) =>
    `<div ${stage === index ? 'class="active" aria-current="step"' : ""}>${index + 1}. ${label}</div>`).join("");
  document.querySelector("#view").innerHTML = screens[state.page]();
  document.querySelector("#notice").textContent = message;
  if (focus) document.querySelector("#title").focus();
}

function download() {
  const lines = ["date,member_id,shift"];
  for (const [id] of sample) {
    dates.forEach((day, index) => lines.push([day, id, effectiveShift(id, index)].join(",")));
  }
  const url = URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], {type:"text/csv;charset=utf-8"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = "demo_effective_roster.csv";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.addEventListener("click", event => {
  const trigger = event.target.closest("button[data-action]");
  if (!trigger || trigger.disabled) return;
  const [action, value] = trigger.dataset.action.split(":");
  let message = "";
  switch (action) {
    case "page": state.page = value; break;
    case "reset": state = start(); message = "演示已重置。"; break;
    case "preview": state.preview = true; break;
    case "leave":
      state.leave = true; state.page = "coverage";
      state.log.push("记录 C03 在 12 月 3 日的全天请假。");
      message = "请假已记录。"; break;
    case "search": state.searched = true; break;
    case "select":
      state.selected = value; state.accepted = false; state.page = "history";
      state.log.push("送交 " + value + " 的方案，等待员工回复。"); break;
    case "accept":
      state.accepted = true;
      state.log.push(state.selected + " 已同意调班。");
      message = "已记录同意，现在可以提交。"; break;
    case "reject":
      state.rejected.push(state.selected);
      state.log.push(state.selected + " 已拒绝调班。");
      state.selected = null; state.accepted = false; state.page = "advisor";
      message = "已记录拒绝，建议已更新。"; break;
    case "commit":
      if (!state.selected || !state.accepted) return;
      state.committed = state.selected;
      state.log.push("提交 " + state.committed + " 的方案，生效排班已更新。");
      message = "调班提交成功。"; break;
    case "export": download(); return;
    default: return;
  }
  render(message, ["page","leave","select","reject","reset"].includes(action));
});

document.addEventListener("change", event => {
  const {id, value} = event.target;
  if (id === "team" || id === "version") {
    state[id] = value;
    render();
    document.getElementById(id).focus();
  }
});

render();
</script>
</body>
</html>
